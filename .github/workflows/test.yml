name: Server checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install latest stable PHP security release
        uses: shivammathur/setup-php@v2
        with:
          php-version: latest
          extensions: iconv, pdo_sqlite, zlib
          coverage: none
        env:
          update: 'true'
      - name: Verify patched PHP runtime
        run: |
          php -v
          php -r 'require "src/bootstrap.php";'
      - name: Check PHP syntax
        run: find src bin tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate panel egg
        run: python3 tests/panel_egg.py
      - name: Run protocol and gameplay checks
        run: php tests/run.php
  panel-egg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install latest stable PHP for configuration checks
        uses: shivammathur/setup-php@v2
        with:
          php-version: latest
          extensions: iconv, pdo_sqlite, zlib
          coverage: none
        env:
          update: 'true'
      - name: Install and run the egg, then reinstall without losing saves
        env:
          PANEL_TEST_REF: ${{ github.sha }}
        run: python3 tests/panel_egg.py --container
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: latest
          extensions: iconv, pdo_sqlite, zlib
          coverage: none
        env:
          update: 'true'
      - name: Test comparison mechanics and PHP replay
        run: |
          python3 tests/parity/harness.py
          python3 tools/packet_coverage.py --check
          python3 tools/parity/run.py --self-test --output tools/.cache/parity-self
      - uses: actions/setup-java@v4
        if: vars.MINECRAFT_EULA_ACCEPTED == 'true'
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare pinned official reference
        if: vars.MINECRAFT_EULA_ACCEPTED == 'true'
        run: |
          python3 tools/update_reference.py
          mkdir -p tools/.cache/parity-consent
          printf '%s\n' '# Repository owner accepted the Minecraft EULA for reference testing.' 'eula=true' > tools/.cache/parity-consent/eula.txt
      - name: Compare vanilla gameplay and validate both wire directions
        if: vars.MINECRAFT_EULA_ACCEPTED == 'true'
        run: |
          python3 tools/parity/run.py --eula-file tools/.cache/parity-consent/eula.txt --output tools/.cache/parity-java
          python3 tools/parity/run.py --scenario tests/parity/lifecycle.json --eula-file tools/.cache/parity-consent/eula.txt --output tools/.cache/parity-lifecycle
          python3 tools/parity/verify.py tools/.cache/parity-java/php-packets.json tools/.cache/parity-java/reference-packets.json tools/.cache/parity-lifecycle/php-packets.json tools/.cache/parity-lifecycle/reference-packets.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-evidence
          path: |
            tools/.cache/parity-self/
            tools/.cache/parity-java/
            tools/.cache/parity-lifecycle/
          retention-days: 7
