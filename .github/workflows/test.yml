name: Server checks
# Branch pushes are tested through their pull requests; main is tested on push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# A newer push to a pull request supersedes its running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    # The full suite, including the command feedback network tests, takes about 16 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install latest stable PHP security release
        uses: shivammathur/setup-php@v2
        with:
          php-version: latest
          extensions: iconv, pdo_sqlite, zlib, openssl, curl
          coverage: none
        env:
          update: 'true'
      - name: Verify patched PHP runtime
        run: |
          php -v
          php -r 'require "src/bootstrap.php";'
      - name: Check PHP syntax
        run: find src bin tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check modular command PHP formatting
        run: python3 tools/php_style.py --check
      - name: Check entity tracking PHP formatting and independent position reconstruction
        run: |
          python3 tools/php_style.py --check src/Server/Tracking src/Protocol/PositionPath.php src/Protocol/RelativePositionCodec.php src/Server/MobMotion.php tests/mob-tracking-unit.php
          python3 tests/parity/entity-motion.py
      - name: Check entity pushing PHP formatting
        run: python3 tools/php_style.py --check src/World/EntityPushing.php src/World/EntitySectionIndex.php src/World/LivingEntityPushPhase.php src/World/EntityPushEligibility.php src/World/Pushing src/Server/MobPushing.php src/Server/Pushing src/Server/Dimensions.php tests/push-eligibility-unit.php tests/mob-pushing-backend.php
      - name: Check complete native command inventory
        run: python3 tools/command_coverage.py --check
      - name: Check spawn initialization PHP formatting
        run: python3 tools/php_style.py --check src/World/Spawning src/World/Generation/Float32.php tests/spawn-initialization-unit.php tests/spawn-groups-unit.php tests/spawn-equipment-unit.php tests/spawn-enchanting-unit.php
      - name: Check item component PHP formatting
        run: python3 tools/php_style.py --check src/Protocol/Components src/Protocol/ItemStackCodec.php src/Protocol/Packets.php src/Protocol/Catalog.php tests/enchantment-component-unit.php tests/equipment-stack-unit.php
      - name: Check inventory bridge PHP formatting
        run: python3 tools/php_style.py --check src/Server/Server.php src/Server/InventoryManagement.php src/Server/Entities.php src/Server/Animals.php src/Server/Survival.php src/World/Inventory.php
      - name: Check entity pushing PHP formatting
        run: python3 tools/php_style.py --check src/World/EntityPushing.php src/World/EntitySectionIndex.php src/World/LivingEntityPushPhase.php tests/entity-pushing-unit.php tests/entity-section-unit.php tests/entity-pushing-world-unit.php
      - name: Validate panel egg
        run: python3 tests/panel_egg.py
      - name: Run protocol and gameplay checks
        run: php tests/run.php
  panel-egg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install latest stable PHP for configuration checks
        uses: shivammathur/setup-php@v2
        with:
          php-version: latest
          extensions: iconv, pdo_sqlite, zlib, openssl, curl
          coverage: none
        env:
          update: 'true'
      - name: Install and run the egg, then reinstall without losing saves
        env:
          PANEL_TEST_REF: ${{ github.sha }}
        run: python3 tests/panel_egg.py --container
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: latest
          extensions: iconv, pdo_sqlite, zlib, openssl, curl
          coverage: none
        env:
          update: 'true'
      - name: Test comparison mechanics and PHP replay
        run: |
          python3 tests/parity/harness.py
          python3 tools/packet_coverage.py --check
          python3 tools/parity/run.py --self-test --output tools/.cache/parity-self
      - uses: actions/setup-java@v4
        if: vars.MINECRAFT_EULA_ACCEPTED == 'true'
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare pinned official reference
        if: vars.MINECRAFT_EULA_ACCEPTED == 'true'
        run: |
          python3 tools/update_reference.py
          php tests/worldgen-noise.php
          php tests/worldgen-density.php
          mkdir -p tools/.cache/parity-consent
          printf '%s\n' '# Repository owner accepted the Minecraft EULA for reference testing.' 'eula=true' > tools/.cache/parity-consent/eula.txt
      - name: Compare vanilla gameplay and validate both wire directions
        if: vars.MINECRAFT_EULA_ACCEPTED == 'true'
        run: |
          python3 tools/parity/run.py --eula-file tools/.cache/parity-consent/eula.txt --output tools/.cache/parity-java
          python3 tools/parity/run.py --scenario tests/parity/lifecycle.json --eula-file tools/.cache/parity-consent/eula.txt --output tools/.cache/parity-lifecycle
          python3 tools/parity/run.py --scenario tests/parity/placement.json --eula-file tools/.cache/parity-consent/eula.txt --output tools/.cache/parity-placement
          python3 tools/parity/run.py --scenario tests/parity/settings.json --eula-file tools/.cache/parity-consent/eula.txt --output tools/.cache/parity-settings
          python3 tools/parity/run.py --scenario tests/parity/music-redstone.json --eula-file tools/.cache/parity-consent/eula.txt --output tools/.cache/parity-music
          python3 tools/parity/run.py --scenario tests/parity/water.json --eula-file tools/.cache/parity-consent/eula.txt --output tools/.cache/parity-water
          python3 tools/parity/run.py --scenario tests/parity/fluids.json --eula-file tools/.cache/parity-consent/eula.txt --output tools/.cache/parity-fluids
          python3 tools/parity/run.py --scenario tests/parity/bubble-columns.json --eula-file tools/.cache/parity-consent/eula.txt --output tools/.cache/parity-bubbles
          python3 tools/parity/run.py --scenario tests/parity/random-ticks.json --eula-file tools/.cache/parity-consent/eula.txt --output tools/.cache/parity-random
          python3 tools/parity/verify.py tools/.cache/parity-music/php-packets.json tools/.cache/parity-music/reference-packets.json tools/.cache/parity-water/php-packets.json tools/.cache/parity-water/reference-packets.json tools/.cache/parity-fluids/php-packets.json tools/.cache/parity-fluids/reference-packets.json tools/.cache/parity-bubbles/php-packets.json tools/.cache/parity-bubbles/reference-packets.json tools/.cache/parity-random/php-packets.json tools/.cache/parity-random/reference-packets.json tools/.cache/parity-settings/php-packets.json tools/.cache/parity-settings/reference-packets.json tools/.cache/parity-placement/php-packets.json tools/.cache/parity-placement/reference-packets.json tools/.cache/parity-java/php-packets.json tools/.cache/parity-java/reference-packets.json tools/.cache/parity-lifecycle/php-packets.json tools/.cache/parity-lifecycle/reference-packets.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-evidence
          path: |
            tools/.cache/parity-self/
            tools/.cache/parity-java/
            tools/.cache/parity-lifecycle/
            tools/.cache/parity-placement/
            tools/.cache/parity-settings/
            tools/.cache/parity-music/
            tools/.cache/parity-water/
            tools/.cache/parity-fluids/
            tools/.cache/parity-bubbles/
            tools/.cache/parity-random/
          retention-days: 7

  multiplayer-parity:
    if: vars.MINECRAFT_EULA_ACCEPTED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: latest
          extensions: iconv, pdo_sqlite, zlib, openssl, curl
          coverage: none
        env:
          update: 'true'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare pinned official reference
        run: |
          python3 tools/update_reference.py
          php tests/worldgen-noise.php
          php tests/worldgen-density.php
          mkdir -p tools/.cache/parity-consent
          printf '%s\n' '# Repository owner accepted the Minecraft EULA for reference testing.' 'eula=true' > tools/.cache/parity-consent/eula.txt
      - name: Compare multiplayer equipment and tracking with vanilla
        run: |
          python3 tools/verify_equipment_stacks.py
          python3 tools/parity/run.py --scenario tests/parity/equipment.json --eula-file tools/.cache/parity-consent/eula.txt --output tools/.cache/parity-equipment
          python3 tools/parity/run.py --scenario tests/parity/tracking.json --eula-file tools/.cache/parity-consent/eula.txt --output tools/.cache/parity-tracking
          python3 tools/parity/verify.py tools/.cache/parity-equipment/php-packets.json tools/.cache/parity-equipment/reference-packets.json tools/.cache/parity-tracking/php-packets.json tools/.cache/parity-tracking/reference-packets.json
          python3 tests/spawn-protection.py --eula-file tools/.cache/parity-consent/eula.txt --output tools/.cache/parity-spawn-protection
          python3 tests/block-breaking.py --eula-file tools/.cache/parity-consent/eula.txt
          python3 tests/spawn-scatter.py --eula-file tools/.cache/parity-consent/eula.txt
          python3 tests/player-motion.py --eula-file tools/.cache/parity-consent/eula.txt
          python3 tests/movement-checks.py --eula-file tools/.cache/parity-consent/eula.txt
          python3 tests/ip-bans.py --eula-file tools/.cache/parity-consent/eula.txt
          python3 tests/player-chat.py --eula-file tools/.cache/parity-consent/eula.txt
          python3 tests/experience-orbs.py --eula-file tools/.cache/parity-consent/eula.txt
          python3 tests/item-entities.py --eula-file tools/.cache/parity-consent/eula.txt
          python3 tests/player-swings.py --eula-file tools/.cache/parity-consent/eula.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multiplayer-parity-evidence
          path: |
            tools/.cache/parity-equipment/
            tools/.cache/parity-tracking/
            tools/.cache/block-breaking/
            tools/.cache/spawn-scatter/
            tools/.cache/player-motion/
            tools/.cache/parity-spawn-protection/
            tools/.cache/movement-checks/
            tools/.cache/ip-bans/
            tools/.cache/player-chat/
            tools/.cache/experience-orbs/
            tools/.cache/item-entities/
            tools/.cache/equipment-stack-verification/
          retention-days: 7

  command-parity:
    if: vars.MINECRAFT_EULA_ACCEPTED == 'true'
    runs-on: ubuntu-latest
    # Each command script runs once on PHP and once on the official server; with nearly two
    # thousand checks and reconnects this takes over two hours on a hosted runner.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: latest
          extensions: iconv, pdo_sqlite, zlib, openssl, curl
          coverage: none
        env:
          update: 'true'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare pinned official reference
        run: |
          python3 tools/update_reference.py
          php tests/worldgen-noise.php
          php tests/worldgen-density.php
          mkdir -p tools/.cache/parity-consent
          printf '%s\n' '# Repository owner accepted the Minecraft EULA for reference testing.' 'eula=true' > tools/.cache/parity-consent/eula.txt
      - name: Compare command feedback bytes with vanilla
        run: python3 tools/parity/command_feedback.py --eula-file tools/.cache/parity-consent/eula.txt --output tools/.cache/command-feedback
      - name: Compare command trees with vanilla
        run: python3 tools/parity/command_tree.py --eula-file tools/.cache/parity-consent/eula.txt --output tools/.cache/command-tree
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: command-parity-evidence
          path: |
            tools/.cache/command-feedback/
            tools/.cache/command-tree/
          retention-days: 7

  mob-parity:
    if: vars.MINECRAFT_EULA_ACCEPTED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: latest
          extensions: iconv, pdo_sqlite, zlib, openssl, curl
          coverage: none
        env:
          update: 'true'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare pinned official reference
        run: |
          python3 tools/update_reference.py
          php tests/worldgen-noise.php
          php tests/worldgen-density.php
          mkdir -p tools/.cache/parity-consent
          printf '%s\n' '# Repository owner accepted the Minecraft EULA for reference testing.' 'eula=true' > tools/.cache/parity-consent/eula.txt
      - name: Compare spawn egg creation and consumption with vanilla
        run: |
          python3 tools/parity/run.py --scenario tests/parity/spawn-eggs.json --eula-file tools/.cache/parity-consent/eula.txt --output tools/.cache/parity-spawn-eggs
          python3 tools/parity/verify.py tools/.cache/parity-spawn-eggs/php-packets.json tools/.cache/parity-spawn-eggs/reference-packets.json
      - name: Compare mob damage, weapon wear and restart with vanilla
        run: |
          python3 tests/mob-combat.py --java-jar tools/.cache/26.3/server.jar --eula-file tools/.cache/parity-consent/eula.txt --output tools/.cache/parity-mob-combat
          python3 tools/parity/verify.py tools/.cache/parity-mob-combat/php-packets.json tools/.cache/parity-mob-combat/java-packets.json
      - name: Compare mob voices, variants, listeners and restart with vanilla
        run: |
          python3 tests/mob-sounds.py --java-jar tools/.cache/26.3/server.jar --eula-file tools/.cache/parity-consent/eula.txt --output tools/.cache/parity-mob-sounds
          python3 tools/parity/verify.py tools/.cache/parity-mob-sounds/php-packets.json tools/.cache/parity-mob-sounds/java-packets.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mob-parity-evidence
          path: |
            tools/.cache/parity-spawn-eggs/
            tools/.cache/parity-mob-combat/
            tools/.cache/parity-mob-sounds/
          retention-days: 7

  movement-parity:
    if: vars.MINECRAFT_EULA_ACCEPTED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: latest
          extensions: iconv, pdo_sqlite, zlib, openssl, curl
          coverage: none
        env:
          update: 'true'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare pinned official reference
        run: |
          python3 tools/update_reference.py
          mkdir -p tools/.cache/parity-consent
          printf '%s\n' '# Repository owner accepted the Minecraft EULA for reference testing.' 'eula=true' > tools/.cache/parity-consent/eula.txt
      - name: Compare controlled native entity pushing
        run: |
          python3 tools/parity/entity_pushing.py --java-home "$JAVA_HOME" --eula-file tools/.cache/parity-consent/eula.txt --output tools/.cache/pushing-java --compare reference/26.3/entity-pushing-trajectories.json
          php tests/entity-pushing-unit.php
          php tests/entity-section-unit.php
          php tests/entity-pushing-world-unit.php
          python3 tools/parity/verify.py tools/.cache/pushing-java/packets.json
      - name: Compare live player and mob collision with vanilla
        run: |
          php tests/push-eligibility-unit.php
          php tests/mob-pushing-backend.php
          python3 tests/entity-pushing-network.py --java-jar tools/.cache/26.3/server.jar --java-home "$JAVA_HOME" --eula-file tools/.cache/parity-consent/eula.txt --output tools/.cache/collision-network
          python3 tools/parity/verify.py tools/.cache/collision-network/*-php/packets.json tools/.cache/collision-network/*-java/packets.json
      - name: Reproduce exact official mob trajectories
        run: |
          python3 tools/parity/mob_motion.py --jar tools/.cache/26.3/server.jar --java-home "$JAVA_HOME" --eula-file tools/.cache/parity-consent/eula.txt --output tools/.cache/motion-java --compare reference/26.3/mob-motion-trajectories.json
          php tests/mob-physics-unit.php
          php tests/mob-motion-unit.php
          php tests/mob-tracking-unit.php
          python3 tests/parity/entity-motion.py
          python3 tools/parity/verify.py tools/.cache/motion-java/packets.json
          python3 tests/mob-knockback.py --java-jar tools/.cache/26.3/server.jar --java-home "$JAVA_HOME" --eula-file tools/.cache/parity-consent/eula.txt --output tools/.cache/knockback-java
          python3 tools/parity/verify.py tools/.cache/knockback-java/php-packets.json tools/.cache/knockback-java/java-packets.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: movement-parity-evidence
          path: |
            tools/.cache/motion-java/
            tools/.cache/knockback-java/
            tools/.cache/pushing-java/
            tools/.cache/collision-network/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build patched PHP container
        run: docker build -t php-minecraft-java-server:gameplay .
      - name: Join, restart, retain saves and deliver the restart reason
        run: python3 tests/docker.py

  authentication-parity:
    if: vars.MINECRAFT_EULA_ACCEPTED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: latest
          extensions: iconv, pdo_sqlite, zlib, openssl, curl
          coverage: none
        env:
          update: 'true'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare pinned official reference
        run: |
          python3 tools/update_reference.py
          php tests/worldgen-noise.php
          php tests/worldgen-density.php
          mkdir -p tools/.cache/parity-consent
          printf '%s\n' '# Repository owner accepted the Minecraft EULA for reference testing.' 'eula=true' > tools/.cache/parity-consent/eula.txt
      - name: Compare encrypted rejection and validate decrypted packets
        run: |
          php tests/authentication-network.php
          php tests/profile-lifecycle.php
          python3 tools/parity/authentication.py --eula-file tools/.cache/parity-consent/eula.txt --output tools/.cache/parity-authentication
          python3 tools/parity/verify.py tools/.cache/parity-authentication/php-packets.json tools/.cache/parity-authentication/java-packets.json /tmp/php-minecraft-auth-verified-packets.json /tmp/php-minecraft-auth-verified-restart-packets.json /tmp/php-minecraft-profile-lifecycle-packets.json /tmp/php-minecraft-profile-lifecycle-restart-packets.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authentication-parity-evidence
          path: tools/.cache/parity-authentication/
          retention-days: 7
